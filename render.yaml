services:
  - type: web
    name: silvershield-frontend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run silvershield_frontend.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: BACKEND_URL
        fromService:
          type: web
          name: silvershield-backend
          property: host

  - type: web
    name: silvershield-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
